<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Design Library</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8fafc; --panel:#ffffff; --panel-2:#f1f5f9; --line:#e2e8f0;
    --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
    --accent:#3B82F6; --accent-soft:#eff6ff;
    --pink:#FF2D8A; --pink-glow:rgba(255,45,138,.12);
    --canvas:#f1f5f9;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
    --ok:#15803d; --ok-soft:#e8f5ec; --draft:#a16207; --draft-soft:#fdf6e3;
    --arch:#64748b; --arch-soft:#f1f5f9;
    --sidebar-w:264px; --radius:10px;
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0f172a; --panel:#1e293b; --panel-2:#334155; --line:#334155;
    --text:#f1f5f9; --text-2:#94a3b8; --text-3:#64748b;
    --accent:#60a5fa; --accent-soft:#1e3a5f;
    --pink:#FF2D8A; --pink-glow:rgba(255,45,138,.15);
    --canvas:#0f172a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --ok:#6ee7a0; --ok-soft:#13291c; --draft:#e8c468; --draft-soft:#2a2313;
    --arch:#94a3b8; --arch-soft:#1e293b;
    color-scheme:dark;
  }
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f172a; --panel:#1e293b; --panel-2:#334155; --line:#334155;
      --text:#f1f5f9; --text-2:#94a3b8; --text-3:#64748b;
      --accent:#60a5fa; --accent-soft:#1e3a5f;
      --pink:#FF2D8A; --pink-glow:rgba(255,45,138,.15);
      --canvas:#0f172a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
      --ok:#6ee7a0; --ok-soft:#13291c; --draft:#e8c468; --draft-soft:#2a2313;
      --arch:#94a3b8; --arch-soft:#1e293b;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font:14px/1.5 'Plus Jakarta Sans',ui-sans-serif,-apple-system,sans-serif;
    color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* ===== SHARED TOPBAR ===== */
  .topbar{
    position:sticky;top:0;z-index:100;height:52px;
    background:var(--pink);color:#fff;
    display:flex;align-items:center;padding:0 16px;gap:12px;
    box-shadow:0 2px 12px rgba(255,45,138,.25);
  }
  .topbar .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.01em;color:#fff;cursor:pointer}
  .topbar .mark{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
  .topbar .spacer{flex:1}
  .topbar .back-btn{
    display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;
    color:rgba(255,255,255,.85);padding:5px 10px;border-radius:7px;transition:.15s;
  }
  .topbar .back-btn:hover{background:rgba(255,255,255,.15);color:#fff}
  .topbar .back-btn svg{width:16px;height:16px}
  .topbar .sep{color:rgba(255,255,255,.35);font-size:16px}
  .topbar .crumb{font-size:13px;font-weight:500;color:rgba(255,255,255,.8)}

  /* mode toggle */
  .mode-seg{
    display:inline-flex;border-radius:8px;overflow:hidden;
    border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);
  }
  .mode-seg button{
    padding:4px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);
    transition:.15s;border-right:1px solid rgba(255,255,255,.15);
  }
  .mode-seg button:last-child{border-right:0}
  .mode-seg button:hover{color:#fff}
  .mode-seg button.on{background:rgba(255,255,255,.25);color:#fff}

  .topbar .theme-btn{
    width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
    font-size:14px;color:rgba(255,255,255,.7);transition:.15s;
  }
  .topbar .theme-btn:hover{background:rgba(255,255,255,.15);color:#fff}

  /* ===== WORK VIEW ===== */
  .work-shell{display:none;flex-direction:column;height:calc(100dvh - 52px)}
  .work-shell.active{display:flex}

  /* work: projects grid */
  .w-projects{padding:40px 32px 60px;overflow-y:auto;flex:1;animation:fadeUp .25s ease}
  .w-projects h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}
  .w-projects .wsub{font-size:14px;color:var(--text-2);margin-bottom:32px}
  .w-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
  .w-pcard{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    cursor:pointer;transition:all .2s ease;overflow:hidden;
  }
  .w-pcard:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(15,23,42,.1);border-color:#cbd5e1}
  .w-pcard.multi{position:relative}
  .w-pcard.multi::before,.w-pcard.multi::after{
    content:"";position:absolute;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel);
  }
  .w-pcard.multi::before{top:-6px;left:6px;right:6px;height:12px;z-index:-1;border-bottom:0}
  .w-pcard.multi::after{top:-3px;left:3px;right:3px;height:8px;z-index:-1;border-bottom:0}
  .w-thumb{height:180px;background:var(--canvas);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  .w-thumb iframe{width:1440px;height:900px;border:0;pointer-events:none;transform-origin:top left;position:absolute;top:0;left:0}
  .w-body{padding:16px 20px 20px}
  .w-body h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .w-body .wdesc{font-size:13px;color:var(--text-2);margin-top:2px}
  .w-body .wcount{display:inline-flex;align-items:center;gap:4px;margin-top:10px;font-size:12px;font-weight:600;color:var(--text-3);background:var(--panel-2);padding:3px 10px;border-radius:6px}

  /* work: versions list */
  .w-versions{padding:40px 32px 60px;max-width:1060px;margin:0 auto;overflow-y:auto;flex:1;animation:fadeUp .25s ease}
  .w-versions h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
  .w-versions .wvsub{font-size:14px;color:var(--text-2);margin:4px 0 24px}
  .w-vlist{display:flex;flex-direction:column;gap:8px}
  .w-vrow{
    display:flex;align-items:center;gap:16px;
    padding:16px 20px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);cursor:pointer;transition:all .15s ease;
  }
  .w-vrow:hover{border-color:var(--pink);background:var(--pink-glow);transform:translateX(4px)}
  .w-vrow .wvid{font-size:14px;font-weight:800;color:var(--pink);background:var(--pink-glow);padding:4px 12px;border-radius:6px;min-width:48px;text-align:center;flex:none}
  .w-vrow .wvlabel{font-size:15px;font-weight:600}
  .w-vrow .wvbadge{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;flex:none;background:var(--ok-soft);color:var(--ok)}
  .w-vrow .wvnotes{font-size:12.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
  .w-vrow .wvdate{font-size:13px;color:var(--text-3);flex:none}
  .w-vrow .wvarrow{color:var(--text-3);flex:none;transition:transform .15s}
  .w-vrow:hover .wvarrow{transform:translateX(4px);color:var(--pink)}

  /* work: full-page preview */
  .w-preview{flex:1;animation:fadeUp .2s ease}
  .w-preview iframe{width:100%;height:100%;border:0;display:block}

  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ===== ADMIN VIEW ===== */
  .admin-shell{display:none;grid-template-columns:var(--sidebar-w) 1fr;height:calc(100dvh - 52px)}
  .admin-shell.active{display:grid}

  .sidebar{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 40px}
  .side-label{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:0 8px 8px}
  .proj{margin-bottom:6px}
  .proj-btn{width:100%;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;text-align:left;font-weight:500}
  .proj-btn:hover{background:var(--panel-2)}
  .proj-btn .chev{color:var(--text-3);transition:transform .15s;flex:none}
  .proj.open .chev{transform:rotate(90deg)}
  .proj-btn .count{margin-left:auto;font-size:11px;color:var(--text-3)}
  .vers{display:none;padding:2px 0 6px 8px;margin-left:11px;border-left:1px solid var(--line)}
  .proj.open .vers{display:block}
  .ver-btn{width:100%;display:flex;align-items:baseline;gap:7px;padding:5px 8px;border-radius:6px;text-align:left;color:var(--text-2);font-size:13px}
  .ver-btn:hover{background:var(--panel-2);color:var(--text)}
  .ver-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
  .ver-btn .vid{font-weight:600;font-size:12px;flex:none}
  .ver-btn .vlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;flex:none;margin-left:auto;align-self:center}
  .dot.current{background:var(--ok)} .dot.draft{background:var(--draft)}
  .dot.archived,.dot.superseded{background:var(--text-3)}

  .admin-main{display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
  .vhead{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px 0}
  .a-crumb{font-size:12px;color:var(--text-3);margin-bottom:3px}
  .vtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .vtitle h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em}
  .badge{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2.5px 7px;border-radius:5px}
  .badge.current{background:var(--ok-soft);color:var(--ok)}
  .badge.draft{background:var(--draft-soft);color:var(--draft)}
  .badge.archived,.badge.superseded{background:var(--arch-soft);color:var(--arch)}
  .vmeta{font-size:12.5px;color:var(--text-2);margin:5px 0 0;max-width:70ch}
  .vdate{font-size:12px;color:var(--text-3)}

  .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:11px 0 10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{padding:0 10px;height:28px;font-size:12.5px;color:var(--text-2);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button:hover{background:var(--panel-2);color:var(--text)}
  .seg button.on{background:var(--accent);color:#fff}
  .tool-sep{width:1px;height:20px;background:var(--line);margin:0 3px}
  .dim{font-size:11.5px;color:var(--text-3);white-space:nowrap}

  .a-canvas{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start;gap:24px}
  .frame-wrap{flex:none}
  .frame-cap{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--text-2)}
  .frame-cap select{font:inherit;font-size:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:240px}
  .shell{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .shell iframe{display:block;border:0;background:#fff}
  .iconbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);color:var(--text-2);font-size:12.5px;white-space:nowrap}
  .iconbtn:hover{background:var(--panel-2);color:var(--text)}
  .iconbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  .a-empty{margin:auto;text-align:center;color:var(--text-3);max-width:34ch;padding:40px 20px}
  .a-empty h2{color:var(--text-2);font-size:15px;font-weight:600;margin:0 0 6px}

  @media(max-width:860px){
    .admin-shell.active{grid-template-columns:1fr}
    .sidebar{display:none}
    .a-canvas{padding:14px;gap:14px}
    .vhead{padding:10px 14px 0}
    .w-projects,.w-versions{padding:24px 16px 40px}
    .w-pgrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ===== TOPBAR ===== -->
<header class="topbar">
  <button class="back-btn" id="backBtn" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="brand" id="homeBtn">
    <span class="mark" id="mark">P</span>
    <span id="brandText">Prototypes</span>
  </button>
  <span class="sep" id="topSep" style="display:none">/</span>
  <span class="crumb" id="topCrumb"></span>
  <span class="spacer"></span>
  <div class="mode-seg" id="modeSeg">
    <button id="modeWork" class="on">Work</button>
    <button id="modeAdmin">Admin</button>
  </div>
  <button class="theme-btn" id="themeBtn" title="Toggle theme">&#9684;</button>
</header>

<!-- ===== WORK VIEW ===== -->
<div class="work-shell active" id="workShell">
  <div class="w-projects" id="wProjects"></div>
  <div class="w-versions" id="wVersions" style="display:none"></div>
  <div class="w-preview" id="wPreview" style="display:none"><iframe id="wFrame" title="Preview"></iframe></div>
</div>

<!-- ===== ADMIN VIEW ===== -->
<div class="admin-shell" id="adminShell">
  <nav class="sidebar" id="sidebar">
    <div class="side-label">Projects</div>
    <div id="projList"></div>
  </nav>
  <main class="admin-main">
    <div class="vhead" id="vhead" hidden>
      <div class="a-crumb" id="aCrumb"></div>
      <div class="vtitle">
        <h1 id="aTitle"></h1>
        <span class="badge" id="aBadge"></span>
        <span class="vdate" id="aDate"></span>
      </div>
      <p class="vmeta" id="aNotes"></p>
      <div class="toolbar">
        <div class="seg" id="devSeg"></div>
        <div class="tool-sep"></div>
        <div class="seg" id="zoomSeg">
          <button data-zoom="fit">Fit</button>
          <button data-zoom="1">100%</button>
        </div>
        <span class="dim" id="dimText"></span>
        <span class="spacer"></span>
        <a class="iconbtn" id="openBtn" target="_blank" rel="noopener">Open &#8599;</a>
        <button class="iconbtn" id="linkBtn" title="Copy link">Copy link</button>
      </div>
    </div>
    <div class="a-canvas" id="aCanvas"></div>
  </main>
</div>

<script src="manifest.js"></script>
<script>
(function(){
  "use strict";
  var LIB = window.DESIGN_LIBRARY || {projects:[]};
  var PROJECTS = LIB.projects || [];
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function findProject(slug){
    for(var i=0;i<PROJECTS.length;i++) if(PROJECTS[i].slug===slug) return PROJECTS[i];
    return null;
  }
  function findVersion(proj,id){
    if(!proj) return null;
    for(var i=0;i<proj.versions.length;i++) if(proj.versions[i].id===id) return proj.versions[i];
    return null;
  }

  /* ===== MODE TOGGLE ===== */
  var mode = "work";
  try{ mode = localStorage.getItem("dl-mode") || "work"; }catch(e){}

  function setMode(m){
    mode = m;
    try{ localStorage.setItem("dl-mode", m); }catch(e){}
    $("modeWork").className = m==="work"?"on":"";
    $("modeAdmin").className = m==="admin"?"on":"";
    $("workShell").className = "work-shell" + (m==="work"?" active":"");
    $("adminShell").className = "admin-shell" + (m==="admin"?" active":"");
    if(m==="work") wGoHome();
    else{ aRenderSidebar(); aRenderCanvas(); }
    updateTopbar();
  }
  $("modeWork").onclick = function(){ setMode("work"); };
  $("modeAdmin").onclick = function(){ setMode("admin"); };

  /* ===== THEME ===== */
  var theme=null;
  try{theme=localStorage.getItem("dl-theme")}catch(e){}
  if(theme) document.documentElement.setAttribute("data-theme",theme);
  $("themeBtn").onclick = function(){
    var cur = document.documentElement.getAttribute("data-theme");
    if(!cur) cur = matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
    var next = cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("dl-theme",next)}catch(e){}
  };

  /* ===== TOPBAR ===== */
  var wState = {view:"projects", project:null, version:null};

  function updateTopbar(){
    if(mode==="admin"){
      $("backBtn").style.display = "none";
      $("topSep").style.display = "none";
      $("topCrumb").textContent = "";
      $("brandText").textContent = LIB.title || "Design Library";
      return;
    }
    if(wState.view==="projects"){
      $("backBtn").style.display = "none";
      $("topSep").style.display = "none";
      $("topCrumb").textContent = "";
      $("brandText").textContent = "Prototypes";
    } else if(wState.view==="versions"){
      $("backBtn").style.display = "";
      $("topSep").style.display = "";
      $("topCrumb").textContent = wState.project ? findProject(wState.project).name : "";
      $("brandText").textContent = "Prototypes";
    } else {
      $("backBtn").style.display = "";
      $("topSep").style.display = "";
      var p = findProject(wState.project);
      var v = findVersion(p, wState.version);
      $("topCrumb").textContent = (p?p.name:"") + (v?" — "+v.label:"");
      $("brandText").textContent = "";
    }
  }

  $("homeBtn").onclick = function(){
    if(mode==="work") wGoHome();
  };
  $("backBtn").onclick = function(){
    if(wState.view==="preview"){
      var p = findProject(wState.project);
      if(p && p.versions.length===1) wGoHome();
      else wShowVersions(wState.project);
    } else if(wState.view==="versions"){
      wGoHome();
    }
  };

  /* ===== WORK VIEW ===== */
  function wGoHome(){
    wState = {view:"projects",project:null,version:null};
    $("wProjects").style.display = "";
    $("wVersions").style.display = "none";
    $("wPreview").style.display = "none";
    wRenderProjects();
    updateTopbar();
    history.replaceState(null,"",location.pathname);
  }

  function wRenderProjects(){
    var el = $("wProjects");
    el.innerHTML = "";
    var h = document.createElement("h1");
    h.textContent = LIB.title || "Prototypes";
    el.appendChild(h);
    var sub = document.createElement("div");
    sub.className = "wsub";
    sub.textContent = PROJECTS.length + " project" + (PROJECTS.length!==1?"s":"");
    el.appendChild(sub);

    var grid = document.createElement("div");
    grid.className = "w-pgrid";
    PROJECTS.forEach(function(p){
      var card = document.createElement("div");
      var multi = p.versions.length > 1;
      card.className = "w-pcard" + (multi?" multi":"");
      card.onclick = function(){
        if(p.versions.length===1) wOpenPreview(p.slug,p.versions[0].id);
        else wShowVersions(p.slug);
      };

      var thumb = document.createElement("div");
      thumb.className = "w-thumb";
      var latest = p.versions[0];
      if(latest){
        var iframe = document.createElement("iframe");
        iframe.src = latest.path; iframe.width=1440; iframe.height=900;
        iframe.loading="lazy"; iframe.tabIndex=-1;
        iframe.setAttribute("aria-hidden","true");
        thumb.appendChild(iframe);
        (function(t,f){ requestAnimationFrame(function(){
          var w=t.clientWidth; if(w>0) f.style.transform="scale("+(w/1440)+")";
        }); })(thumb,iframe);
      }
      card.appendChild(thumb);

      var body = document.createElement("div");
      body.className = "w-body";
      body.innerHTML = "<h2>"+esc(p.name)+"</h2>" +
        (p.description?'<div class="wdesc">'+esc(p.description)+"</div>":"");
      if(multi) body.innerHTML += '<div class="wcount">'+p.versions.length+" versions</div>";
      card.appendChild(body);
      grid.appendChild(card);
    });
    el.appendChild(grid);
  }

  function wShowVersions(slug){
    var proj = findProject(slug);
    if(!proj) return;
    wState = {view:"versions",project:slug,version:null};
    $("wProjects").style.display = "none";
    $("wVersions").style.display = "";
    $("wPreview").style.display = "none";

    var el = $("wVersions");
    el.innerHTML = "";
    var h = document.createElement("h1");
    h.textContent = proj.name;
    el.appendChild(h);
    var sub = document.createElement("div");
    sub.className = "wvsub";
    sub.textContent = proj.description || "";
    el.appendChild(sub);

    var list = document.createElement("div");
    list.className = "w-vlist";
    proj.versions.forEach(function(v){
      var row = document.createElement("div");
      row.className = "w-vrow";
      row.onclick = function(){ wOpenPreview(slug,v.id); };
      row.innerHTML =
        '<span class="wvid">'+esc(v.id).toUpperCase()+'</span>'+
        '<span class="wvlabel">'+esc(v.label)+'</span>'+
        (v.status==="current"?'<span class="wvbadge">Live</span>':'')+
        (v.notes?'<span class="wvnotes">'+esc(v.notes)+'</span>':'<span class="wvnotes"></span>')+
        '<span class="wvdate">'+esc(v.date)+'</span>'+
        '<svg class="wvarrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
      list.appendChild(row);
    });
    el.appendChild(list);
    updateTopbar();
    history.replaceState(null,"","#/"+slug);
  }

  function wOpenPreview(slug,vid){
    wState = {view:"preview",project:slug,version:vid};
    $("wProjects").style.display = "none";
    $("wVersions").style.display = "none";
    $("wPreview").style.display = "";
    var proj = findProject(slug);
    var ver = findVersion(proj,vid);
    if(ver) $("wFrame").src = ver.path;
    updateTopbar();
    history.replaceState(null,"","#/"+slug+"/"+vid);
  }

  /* ===== ADMIN VIEW ===== */
  var aState = {project:null,version:null,device:"desktop",zoom:"fit",compare:false,versionB:null};
  var DEVICES = [
    {id:"desktop",name:"Desktop",w:1440,h:900},
    {id:"laptop",name:"Laptop",w:1280,h:800},
    {id:"tablet",name:"Tablet",w:834,h:1112},
    {id:"phone",name:"Phone",w:390,h:844}
  ];
  function aDevice(id){ for(var i=0;i<DEVICES.length;i++) if(DEVICES[i].id===id) return DEVICES[i]; return DEVICES[0]; }

  function aRenderSidebar(){
    var host=$("projList"); host.innerHTML="";
    PROJECTS.forEach(function(p){
      var wrap=document.createElement("div");
      wrap.className="proj"+(aState.project===p.slug?" open":"");
      var btn=document.createElement("button");
      btn.className="proj-btn";
      btn.innerHTML='<span class="chev">&#8250;</span><span>'+esc(p.name)+'</span><span class="count">'+p.versions.length+'</span>';
      btn.onclick=function(){
        if(aState.project===p.slug&&wrap.classList.contains("open")) wrap.classList.toggle("open");
        else{ var l=p.versions[0]; if(l) aGo(p.slug,l.id); }
      };
      wrap.appendChild(btn);
      var vs=document.createElement("div"); vs.className="vers";
      p.versions.forEach(function(v){
        var vb=document.createElement("button");
        vb.className="ver-btn"+(aState.project===p.slug&&aState.version===v.id?" active":"");
        vb.innerHTML='<span class="vid">'+esc(v.id)+'</span><span class="vlabel">'+esc(v.label||"")+'</span><span class="dot '+esc(v.status||"")+'"></span>';
        vb.onclick=function(){ aGo(p.slug,v.id); };
        vs.appendChild(vb);
      });
      wrap.appendChild(vs); host.appendChild(wrap);
    });
  }

  function aGo(slug,vid){
    aState.project=slug; aState.version=vid;
    aRenderSidebar(); aRenderToolbar(); aRenderCanvas();
  }

  function aRenderToolbar(){
    var seg=$("devSeg"); seg.innerHTML="";
    DEVICES.forEach(function(d){
      var b=document.createElement("button"); b.textContent=d.name;
      if(d.id===aState.device) b.className="on";
      b.onclick=function(){ aState.device=d.id; aRenderToolbar(); aRenderCanvas(); };
      seg.appendChild(b);
    });
    var zs=$("zoomSeg").children;
    for(var i=0;i<zs.length;i++){
      zs[i].className=zs[i].dataset.zoom===aState.zoom?"on":"";
      zs[i].onclick=(function(z){ return function(){ aState.zoom=z; aRenderCanvas(); aRenderToolbar(); }; })(zs[i].dataset.zoom);
    }
  }

  function aRenderCanvas(){
    var canvas=$("aCanvas"); canvas.innerHTML="";
    var proj=findProject(aState.project), ver=findVersion(proj,aState.version);
    if(!ver){
      $("vhead").hidden=true;
      var e=document.createElement("div"); e.className="a-empty";
      e.innerHTML="<h2>Pick a version</h2><p>Choose a project on the left.</p>";
      canvas.appendChild(e); return;
    }
    $("vhead").hidden=false;
    $("aCrumb").textContent=proj.name+(proj.description?" · "+proj.description:"");
    $("aTitle").textContent=ver.label||ver.id;
    var badge=$("aBadge");
    if(ver.status){badge.hidden=false;badge.textContent=ver.status;badge.className="badge "+ver.status;}else badge.hidden=true;
    $("aDate").textContent=ver.date||"";
    $("aNotes").textContent=ver.notes||"";
    $("openBtn").href=ver.path;

    var d=aDevice(aState.device);
    $("dimText").textContent=d.w+" \u00d7 "+d.h;
    var pad=48,gap=24,avail=canvas.clientWidth-pad;
    var scale=aState.zoom==="fit"?Math.min(1,avail/d.w):1;

    var wrap=document.createElement("div"); wrap.className="frame-wrap"; wrap.style.width=(d.w*scale)+"px";
    var cap=document.createElement("div"); cap.className="frame-cap";
    cap.innerHTML='<strong>'+esc(ver.id)+'</strong> <span style="color:var(--text-3)">'+esc(ver.date||"")+'</span>';
    if(scale<1){ var z=document.createElement("span"); z.style.cssText="margin-left:auto;color:var(--text-3);font-size:11.5px"; z.textContent=Math.round(scale*100)+"%"; cap.appendChild(z); }
    wrap.appendChild(cap);
    var holder=document.createElement("div"); holder.style.cssText="height:"+(d.h*scale)+"px;overflow:hidden";
    var sh=document.createElement("div"); sh.className="shell"; sh.style.cssText="width:"+d.w+"px;height:"+d.h+"px;transform:scale("+scale+");transform-origin:top left";
    var f=document.createElement("iframe"); f.src=ver.path; f.width=d.w; f.height=d.h; f.loading="lazy"; f.title=proj.name+" "+ver.id;
    sh.appendChild(f); holder.appendChild(sh); wrap.appendChild(holder); canvas.appendChild(wrap);
  }

  $("linkBtn").onclick=function(){
    var url=location.href, btn=$("linkBtn");
    function done(){btn.textContent="Copied \u2713";setTimeout(function(){btn.textContent="Copy link"},1400)}
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,done); else done();
  };

  var rt;
  addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){ if(mode==="admin") aRenderCanvas(); },120)});

  /* ===== BOOT ===== */
  if(LIB.initial) $("mark").textContent = LIB.initial;
  setMode(mode);
})();
</script>
</body>
</html>
